[project]
name = "hw1"
version = "0.1.0"
description = "Homework 1 - Analytical performance model of a small CNN (ITMO Efficient Models 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "scipy>=1.15",
    "nvidia-ml-py>=12.560.30",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
